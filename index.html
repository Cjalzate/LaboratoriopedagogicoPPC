/* ---------- datos de ejemplo (solo demostración) ---------- */
function seedDemo() {
  var names = [['Laura Pineda', 'Camilo Rendón', 'Daniela Mejía', 'Felipe Ospina', 'Ana Sofía Lara'], ['Julián Agudelo', 'Paula Echeverri', 'Nicolás Hoyos', 'Melisa Tobón'], ['Andrés Castrillón', 'Sofía Bedoya', 'Esteban Londoño', 'Valentina Arias']];
  var nodos = [4, 5, 7]; var roles = ['comunidad', 'asesoria', 'institucion', 'relatoria', 'defensoria'];
  var calls = [];
  names.forEach(function (grp, gi) {
    var teamId = 'm' + (gi + 1); var nodo = nodos[gi]; var nd = NODO_BY_ID[nodo];
    var cards = CARDS.filter(function (c) { return c.nodos !== 'base' && c.nodos.indexOf(nodo) >= 0; }).concat(CARDS.filter(function (c) { return c.nodos === 'base'; }).slice(0, 4));
    grp.forEach(function (nm, i) {
      var sid = 'ex' + gi + i; var rol = roles[i]; var av = avDefault(nm + gi, rol);
      var ops = [{ k: 's:' + sid, p: [], m: 'set', v: { sid: sid, seud: nm + ' (ejemplo)', av: av, team: teamId, rol: rol, nodo: nodo, t: Date.now(), done: { nodo: 1 } } }];
      var evs = [{ tipo: 'perfil', el: teamId, det: {} }, { tipo: 'nodo_leido', el: 'nodo' + nodo, det: {} }];
      cards.filter(function (c, j) { return j % grp.length === i; }).forEach(function (c) { ops.push({ k: 't:' + teamId, p: ['matriz', c.id], m: 'set', v: { tipo: tipoPrincipal(c), col: c.cols[0], by: sid, t: Date.now() } }); evs.push({ tipo: 'clasificar_ok', el: c.id, det: {} }); });
      nd.actores.filter(function (a, j) { return j % grp.length === i; }).forEach(function (a) { ops.push({ k: 't:' + teamId, p: ['actores', a], m: 'set', v: { z: ACTOR_ZONA[a], by: sid, t: Date.now() } }); evs.push({ tipo: 'actor_ok', el: a, det: {} }); });
      var sec = DICT.find(function (d) { return d.rol === rol; }).id;
      var marco = cards.filter(function (c) { return c.cols[0] === 'marco'; }).map(function (c) { return c.id; });
      var ofi = cards.filter(function (c) { return c.cols[0] === 'oficial'; }).map(function (c) { return c.id; });
      var ter = cards.filter(function (c) { return c.cols[0] === 'territorial' && !pendiente(c); }).map(function (c) { return c.id; });
      var argTxt = { derechos: 'Desde la Defensoría (recreación), el derecho a la vida y a la vivienda digna están en juego, porque las familias pueden quedar sin techo mientras siguen las obras (ejemplo).', territorio: 'Afirmamos que las familias de la ladera necesitan ser escuchadas antes de demoler, porque el desalojo afecta su arraigo y sus medios de vida (ejemplo).', institucion: 'Desde la mirada de la Alcaldía, evacuar buscaba evitar otra muerte. Pero desde la mirada de la comunidad, faltó concertar las obras (ejemplo).', normas: 'La norma de la acción popular protege el derecho colectivo a la prevención de desastres. En este caso sirve porque el riesgo afecta a todo el barrio (ejemplo).', evidencias: 'Según la Alcaldía, 73 viviendas estaban en riesgo, por eso se ordenó evacuar; el material docente habla de 68 familias y falta verificar esa cifra (ejemplo).' }[sec];
      var argCards = { derechos: marco.slice(0, 1).concat(ter.slice(0, 1)), territorio: ter.slice(0, 1).concat(ofi.slice(0, 1)), institucion: ofi.slice(0, 1).concat(ter.slice(0, 1)), normas: marco.slice(0, 1), evidencias: ['B02', 'B13'] }[sec];
      ops.push({ k: 't:' + teamId, p: ['args', sec, sid + 'a'], m: 'set', v: { txt: argTxt, cards: argCards, by: sid, t: Date.now() } }); evs.push({ tipo: 'argumento', el: sec, det: {} });
      if (rol === 'comunidad') { ops.push({ k: 't:' + teamId, p: ['titulo'], m: 'set', v: { txt: 'Entre el riesgo y el arraigo: la ladera también decide (ejemplo)', by: sid, t: Date.now() } }); evs.push({ tipo: 'dict_titulo', el: 'titulo', det: {} }); }
      if (rol === 'asesoria') { ops.push({ k: 't:' + teamId, p: ['herr', nodo, 'sol'], m: 'set', v: { txt: 'Solicitamos a la autoridad competente información de fondo sobre las obras y una mesa de concertación con las familias, porque las versiones no coinciden (ejemplo).', cards: ofi.slice(0, 1).concat(ter.slice(0, 1)), by: sid, t: Date.now() } }); [0, 1, 2].forEach(function (r) { ops.push({ k: 't:' + teamId, p: ['herr', nodo, 'req', String(r)], m: 'set', v: true }); }); evs.push({ tipo: 'herr_solicitud', el: String(nodo), det: {} }, { tipo: 'herr_ok', el: nodo + '-ante', det: {} }); }
      if (gi < 2) {
        BLOQUES.forEach(function (b) { var o = (b.rol === rol) || (b.id === 'b4' && rol === 'institucion'); if (o) { ops.push({ k: 't:' + teamId, p: ['guion', b.id], m: 'set', v: { txt: b.frame.replace(/___/g, 'lo que muestran nuestras pruebas') + ' (ejemplo)', by: sid, t: Date.now() } }); evs.push({ tipo: 'guion', el: b.id, det: {} }); } });
        if (rol === 'relatoria') { ops.push({ k: 't:' + teamId, p: ['kit'], m: 'set', v: { b1: ofi.slice(0, 1).concat(ter.slice(0, 1)), b2: ['territorio:ex' + gi + '0a'], b3: ['normas:ex' + gi + '1a'] } }); evs.push({ tipo: 'kit', el: 'b1', det: {} }); }
      }
      calls.push({ a: 'ops', sala: ME.sala, role: 'doc', pin: ME.pin, as: sid, ops: ops, ev: evs });
    });
  });
  return calls.reduce(function (pr, c) { return pr.then(function () { return T.call(c); }); }, Promise.resolve());
}
