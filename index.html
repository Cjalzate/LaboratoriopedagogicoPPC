<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hemiciclo Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Estética: cyber-noir corporativo + realismo territorial de Medellín. El laboratorio es sobrio
   (grafito, carbón azulado, azul petróleo); en la audiencia aparecen curvas de nivel de la ladera,
   terracota, verde quebrada y magenta. Ámbar solo para turnos y pendientes; cian solo para M.E.R.C.Y.
   El color nunca codifica bueno, malo, culpable o inocente. */
:root {
  --paper: #0E1318; --panel: #161D24; --sunk: #10161C; --raise: #1D262F;
  --ink: #E8EEF2; --muted: #A3B1BC; --line: #27333E; --line2: #364552;
  --acc: #7FC0D1; --accion: #1F7A93; --accion-h: #2489A4; --petroleo: #0F3B4A; --silver: #E2EDF2;
  --cyan: #8CEBFA; --amber: #E4AC58; --terra: #D7C17A; --quebrada: #8CEBFA; --magenta: #E77964;
  --signal: #E4AC58; --signal-soft: #2B2112; --on-signal: #1A1206;
  --quebrada-soft: #12302A; --on-quebrada: #FFFFFF;
  --good: #59C98F; --good-soft: #122A20; --bad: #E4AC58; --bad-soft: #2B2112; --warn: #F2C46B;
  --n1: #E58AB4; --n2: #A994E6; --n3: #7DB2E8; --n4: #6FCB8F; --n5: #E7C25E; --n6: #E9955F; --n7: #E07A7A;
  --shadow: 0 10px 28px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(226, 237, 242, .05);
  --glow: 0 0 0 1px rgba(140, 235, 250, .45), 0 0 18px rgba(140, 235, 250, .15);
  --f-display: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 8px; color-scheme: dark;
}
html.hc { --ink: #FFFFFF; --muted: #E4E4E4; --line: #FFFFFF; --line2: #FFFFFF; --paper: #000; --panel: #000; --sunk: #0A0A0A; --raise: #111; }
html.fs1 { font-size: 112.5%; }
html.fs2 { font-size: 128%; }
html.rm *, html.rm *::before, html.rm *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
* { box-sizing: border-box; }
html { background: radial-gradient(1100px 620px at 78% -8%, rgba(140, 235, 250, .11), transparent 62%), radial-gradient(900px 520px at -12% 108%, rgba(215, 193, 122, .08), transparent 60%), var(--paper); background-attachment: fixed; color: var(--ink); min-height: 100%; }
body { margin: 0; font-family: var(--f-body); font-size: 1rem; line-height: 1.55; background: transparent; color: var(--ink); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(rgba(140, 235, 250, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(140, 235, 250, .05) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 85%); -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 85%); }
html.hc body::after { display: none; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0 0 .5em; letter-spacing: .01em; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); font-weight: 700; }
h2 { font-size: 1.32rem; font-weight: 700; margin-top: 1.2em; }
h3 { font-size: 1.08rem; font-weight: 600; }
h4 { font-size: .98rem; font-weight: 600; color: var(--acc); margin-top: .6em; }
p { margin: 0 0 .7em; }
a { color: var(--quebrada); }
code, .mono { font-family: var(--f-mono); font-size: .9em; }
small, .small { font-size: .88rem; color: var(--muted); }
.lead { font-size: 1.12rem; max-width: 62ch; color: var(--muted); }
.intro { max-width: 70ch; color: var(--muted); }
.note { font-size: .9rem; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: .6em .8em; }
.empty { color: var(--muted); font-style: italic; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: .55em .7em; width: 100%; }
textarea { resize: vertical; min-height: 3em; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--signal-soft); }
label, .lbl { display: block; font-weight: 700; font-size: .92rem; margin: .8em 0 .3em; }
fieldset { border: 0; padding: 0; margin: .6em 0; }
legend { font-weight: 700; font-size: .9rem; margin-bottom: .35em; }

.btn, .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: .4em; border-radius: 8px; padding: .55em 1em; font-weight: 700; border: 2px solid var(--ink); }
.btn { background: var(--signal); color: var(--on-signal); box-shadow: 3px 3px 0 var(--ink); }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.big { font-size: 1.1rem; padding: .75em 1.4em; }
.btn.sm, .btn-ghost.sm { padding: .3em .65em; font-size: .85rem; }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); background: var(--sunk); }
.linkbtn { background: none; border: 0; color: var(--quebrada); text-decoration: underline; padding: 0; font-size: inherit; }
.row { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; margin-top: .8em; }
.row.end { justify-content: flex-end; }
.row label { margin: 0; }
.row select { width: auto; min-width: 10em; }

.panel { background: var(--panel); border: 2px solid var(--ink); border-radius: var(--r); padding: 1.1em 1.2em; box-shadow: var(--shadow); margin: 1.1em 0; min-width: 0; }
.panel > h2:first-child, .panel > header h2 { margin-top: 0; }
.center { text-align: center; }
.callout { border-left: 6px solid var(--quebrada); background: var(--quebrada-soft); padding: .8em 1em; border-radius: 0 8px 8px 0; margin: 1em 0; }
.callout.ok { border-color: var(--good); background: var(--good-soft); }
.callout.verif { border-color: var(--signal); background: var(--signal-soft); }
.warnbox { border-color: var(--warn); }
.ok-mark { color: var(--good); font-weight: 700; font-size: .88rem; }

/* cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 2px solid var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top-in { display: flex; flex-wrap: wrap; gap: .5em 1.2em; align-items: center; padding: .55em max(16px, env(safe-area-inset-right, 0px)) .55em max(16px, env(safe-area-inset-left, 0px)); max-width: 1240px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: .55em; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; display: block; line-height: 1.1; }
.brand span { font-size: .78rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.who { display: flex; align-items: center; gap: .5em; }
.who b { display: block; line-height: 1.1; }
.who span { font-size: .8rem; color: var(--muted); }
.top-r { margin-left: auto; display: flex; flex-wrap: wrap; gap: .4em; align-items: center; }
.net { font-size: .75rem; font-weight: 700; padding: .25em .6em; border-radius: 99px; background: var(--sunk); text-transform: uppercase; letter-spacing: .05em; }
.net.on::before, .net.off::before { content: ""; display: inline-block; width: .55em; height: .55em; border-radius: 50%; margin-right: .4em; background: var(--good); }
.net.off::before { background: var(--bad); }
.mainnav { display: flex; gap: 0; max-width: 1240px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; }
.mainnav button { background: none; border: 0; border-bottom: 4px solid transparent; padding: .5em 1em; font-weight: 700; white-space: nowrap; }
.mainnav button.on { border-color: var(--signal); }
.mainnav button.pulse { color: var(--quebrada); }
.mainnav button.pulse::after { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--bad); margin-left: .4em; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .2; } }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 1.2em 3em; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* entrar */
.entrar { max-width: 1100px; margin: 0 auto; padding-block: 2em 3em; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.5em 2.5em; align-items: start; }
.entrar .hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); margin: .6em 0 .3em; max-width: 14ch; }
.hero-art { display: flex; align-items: center; gap: 1em; margin-top: 1.2em; }
.bubble { position: relative; background: var(--panel); border: 2px solid var(--ink); border-radius: 14px; padding: .7em 1em; box-shadow: 3px 3px 0 var(--ink); max-width: 46ch; }
.bubble .btn-ghost { margin-left: .5em; }
.bubble.xl { font-size: 1.25rem; font-family: var(--f-display); font-weight: 600; }
.join h2 { margin-top: 0; }
.join input.big { font-family: var(--f-mono); font-size: 1.4rem; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
.join .btn.big { width: 100%; margin-top: 1em; }
.join input.big::placeholder { text-transform: none; letter-spacing: normal; font-size: 1rem; font-family: var(--f-body); }
.alt { grid-column: 2; display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
.alt span { font-size: .85rem; color: var(--muted); }
.pinbox { grid-column: 2; }
@media (max-width: 820px) { .entrar { grid-template-columns: 1fr; } .alt, .pinbox { grid-column: 1; } }

/* perfil */
.pf-grid { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 1.5em; }
.pf-prev { text-align: center; }
.pf-prev svg { margin: 0 auto; display: block; }
.pf-prev label { text-align: left; }
.pf-ops h3 { margin: 1em 0 .4em; font-size: .95rem; }
.sw { display: flex; flex-wrap: wrap; gap: .45em; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); }
.swatch.on { border: 3px solid var(--ink); box-shadow: 0 0 0 3px var(--signal); }
.opt { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: .4em .75em; font-size: .9rem; text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.on { border-color: var(--ink); background: var(--signal-soft); font-weight: 700; box-shadow: 2px 2px 0 var(--ink); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.right:disabled, .opt.wrong:disabled { opacity: 1; }
.opts { display: flex; flex-wrap: wrap; gap: .4em; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .8em; }
.rolecard, .nodecard { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: .9em 1em; display: flex; flex-direction: column; gap: .3em; }
.rolecard b, .nodecard b { font-family: var(--f-display); }
.rolecard span { font-size: .88rem; color: var(--muted); }
.rolecard em, .nodecard em { font-size: .78rem; color: var(--warn); font-style: normal; font-weight: 700; }
.rolecard.on, .nodecard.on { border-color: var(--ink); box-shadow: var(--shadow); background: var(--signal-soft); }
.grid-nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: .8em; }
.nodecard { border-left-width: 10px; }
.nodecard i { font-style: normal; font-family: var(--f-mono); font-weight: 700; font-size: .8rem; }
@media (max-width: 700px) { .pf-grid { grid-template-columns: 1fr; } }

/* colores de nodo */
.n1 { --nc: var(--n1); } .n2 { --nc: var(--n2); } .n3 { --nc: var(--n3); } .n4 { --nc: var(--n4); } .n5 { --nc: var(--n5); } .n6 { --nc: var(--n6); } .n7 { --nc: var(--n7); } .nIA { --nc: var(--quebrada); }
.nodecard, .nodetile, .mcard { border-left-color: var(--nc); }
.chip { display: inline-block; font-size: .78rem; font-weight: 700; padding: .15em .55em; border-radius: 99px; background: var(--nc, var(--muted)); color: #fff; line-height: 1.4; }
.chip.sm { font-size: .72rem; }
.chip.base { background: var(--ink); color: var(--panel) !important; }
.chip:not(.base) { color: #fff !important; }

/* laboratorio */
.labhead { display: flex; flex-wrap: wrap; gap: 1em 2em; align-items: flex-end; justify-content: space-between; }
.labhead h1 { margin-bottom: .2em; }
.ahora { margin: 0; font-weight: 700; }
.ahora span { background: var(--signal); color: var(--on-signal); padding: .1em .5em; border-radius: 4px; margin-right: .3em; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
.teamstrip { display: flex; flex-wrap: wrap; gap: .5em; }
.mate { position: relative; display: flex; gap: .4em; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 99px; padding: .2em .8em .2em .25em; }
.mate b { display: block; font-size: .85rem; line-height: 1.1; }
.mate span { font-size: .72rem; color: var(--muted); }
.dot { position: absolute; left: 30px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--line); border: 2px solid var(--panel); }
.dot.on { background: var(--good); }
.dot.inline { position: static; display: inline-block; border-color: var(--line); }
.livebanner { display: block; width: 100%; text-align: left; background: var(--quebrada); color: var(--on-quebrada); border: 2px solid var(--ink); border-radius: var(--r); padding: .8em 1em; margin-bottom: 1em; box-shadow: var(--shadow); }
.tabs { display: flex; gap: .3em; overflow-x: auto; border-bottom: 2px solid var(--ink); margin: 1.2em 0 0; }
.tabs button { background: var(--sunk); border: 2px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; padding: .5em 1em; font-weight: 700; white-space: nowrap; }
.tabs button.on { background: var(--panel); border-color: var(--ink); position: relative; top: 2px; }
.tabbody { padding-top: 1em; min-width: 0; }

.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .9em; margin: 1em 0; }
.nodetile { text-align: left; background: var(--panel); border: 2px solid var(--line); border-left: 10px solid var(--nc); border-radius: var(--r); padding: .9em 1em; display: flex; flex-direction: column; gap: .35em; position: relative; }
.nodetile i { font-style: normal; font-family: var(--f-mono); font-weight: 700; font-size: .8rem; color: var(--nc); }
.nodetile b { font-family: var(--f-display); font-size: 1.02rem; line-height: 1.2; }
.nodetile span { font-size: .86rem; color: var(--muted); }
.nodetile em { position: absolute; top: .6em; right: .7em; font-size: .7rem; font-style: normal; font-weight: 700; background: var(--signal); color: var(--on-signal); padding: .1em .45em; border-radius: 4px; }
.nodetile.on { border-color: var(--ink); box-shadow: var(--shadow); }
.ficha header { display: flex; justify-content: space-between; align-items: center; gap: .5em; margin-bottom: .6em; }
.ficha-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1em 1.6em; }
.ficha ul { padding-left: 1.2em; margin: 0 0 .8em; }
.tags { display: flex; flex-wrap: wrap; gap: .35em; }
.tags span { background: var(--sunk); border-radius: 6px; padding: .15em .55em; font-size: .85rem; }
.srcline { font-size: .82rem; color: var(--muted); margin: .3em 0; }
.src { font-size: .82rem; }
.timeline { list-style: none; padding: 0; margin: 0; border-left: 3px solid var(--ink); }
.timeline li { position: relative; padding: 0 0 1em 1.2em; }
.timeline li::before { content: ""; position: absolute; left: -9px; top: .35em; width: 13px; height: 13px; background: var(--signal); border: 2px solid var(--ink); border-radius: 50%; }
.timeline time { font-family: var(--f-mono); font-size: .82rem; font-weight: 700; }
.timeline p { margin: 0; max-width: 70ch; }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .3em 1.2em; font-size: .82rem; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: .7em .9em; }
.evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1em; }
.evcard { background: var(--panel); border: 2px solid var(--ink); border-radius: var(--r); padding: .9em 1em; box-shadow: var(--shadow); min-width: 0; }
.evcard header, .mi-h { display: flex; flex-wrap: wrap; gap: .4em; align-items: center; }
.evcard header .btn-ghost { margin-left: auto; }
.cid { font-family: var(--f-mono); font-weight: 700; font-size: .78rem; background: var(--ink); color: var(--panel); padding: .1em .4em; border-radius: 4px; }
.evtxt { font-size: 1.02rem; margin: .6em 0 .2em; }
.hint { font-size: .88rem; background: var(--signal-soft); border-radius: 6px; padding: .4em .6em; }
.hint.reveal { background: var(--bad-soft); }
.est { font-size: .72rem; font-weight: 700; padding: .1em .5em; border-radius: 4px; border: 1.5px solid currentColor; }
.est-verificada { color: var(--good); } .est-disputa { color: var(--warn); } .est-sinverificar { color: var(--bad); } .est-plan { color: var(--n2); } .est-hipotesis { color: var(--n3); } .est-concepto { color: var(--quebrada); }
.matriz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9em; align-items: start; }
.mcol { background: var(--sunk); border: 2px solid var(--ink); border-radius: var(--r); padding: .7em; min-width: 0; }
.mcol h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3em .6em; border-bottom: 3px solid var(--colc); padding-bottom: .4em; }
.mcol h3 span { font-size: .78rem; color: var(--muted); font-family: var(--f-body); font-weight: 400; }
.mcol h3 em { margin-left: auto; font-style: normal; font-family: var(--f-mono); }
.mcol-oficial { --colc: var(--n3); } .mcol-territorial { --colc: var(--n6); } .mcol-marco { --colc: var(--quebrada); }
.col-oficial.on { background: color-mix(in srgb, var(--n3) 18%, var(--panel)); } .col-territorial.on { background: color-mix(in srgb, var(--n6) 18%, var(--panel)); } .col-marco.on { background: color-mix(in srgb, var(--quebrada) 18%, var(--panel)); }
.mitem { background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: .55em .65em; margin-top: .55em; font-size: .88rem; }
.mitem p { margin: .3em 0; }
.mi-h .tipo { font-size: .74rem; font-weight: 700; color: var(--muted); }
.mi-f { display: flex; flex-wrap: wrap; align-items: center; gap: .35em; font-size: .78rem; color: var(--muted); }
.mi-f .btn-ghost, .mi-f .ok-mark { margin-left: auto; }
.confq { width: 100%; display: grid; gap: .3em; margin-top: .4em; }
.confq p { margin: 0; color: var(--ink); }
@media (max-width: 860px) { .matriz { grid-template-columns: 1fr; } .evgrid { grid-template-columns: 1fr; } }

.dimcover { display: flex; flex-wrap: wrap; gap: .4em; align-items: center; margin: .6em 0; }
.pip { font-size: .78rem; padding: .15em .55em; border-radius: 99px; border: 2px solid var(--line); color: var(--muted); }
.pip.on { border-color: var(--dc); background: var(--dc); color: #fff; }
.dim-social { --dc: var(--n1); } .dim-economica { --dc: var(--n5); } .dim-ambiental { --dc: var(--n4); } .dim-politica { --dc: var(--n2); } .dim-juridica { --dc: var(--quebrada); }
.opt[class*="dim-"].on { background: color-mix(in srgb, var(--dc) 22%, var(--panel)); }
.mf { display: grid; grid-template-columns: 1fr auto 1fr; gap: .6em; align-items: end; }
.mf .arrow { font-size: 1.6rem; font-weight: 800; padding-bottom: .3em; }
.mf input { margin-top: .4em; }
@media (max-width: 640px) { .mf { grid-template-columns: 1fr; } .mf .arrow { display: none; } }
.dimgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6em; margin: 1em 0; }

.btn { background: var(--acc); border-color: var(--acc); color: var(--on-quebrada); box-shadow: 0 0 18px rgba(140, 235, 250, .25); }

.chip { border-radius: 4px; background: color-mix(in srgb, var(--nc, var(--muted)) 16%, transparent); border: 1px solid var(--nc, var(--muted)); color: var(--nc, var(--muted)) !important; font-family: var(--f-mono); letter-spacing: .02em; }

/* cabecera */
.top { background: rgba(5, 8, 14, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
body::before { background: var(--paper); }

.mainnav button { font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; font-size: .9rem; color: var(--muted); border-bottom-width: 2px; }

/* entrar */

/* perfil: personajes */
.chargrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .9em; margin: 1.2em 0; }
.charcard { --rc: var(--acc); position: relative; display: flex; flex-direction: column; align-items: center; gap: .35em; text-align: center; background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 10%, transparent), transparent 70%), var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 1em .8em 1.1em; color: var(--ink); min-width: 0; }

.charcard i { font-style: normal; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.charcard.on::after { content: "ELEGIDO"; position: absolute; top: .5em; right: .5em; font-family: var(--f-mono); font-size: .62rem; letter-spacing: .14em; padding: .15em .45em; border: 1px solid var(--rc); color: var(--rc); border-radius: 3px; }

.pf-prev { display: flex; flex-direction: column; align-items: center; }
.pf-role { font-family: var(--f-display); font-size: 1.15rem; margin-top: .5em; color: var(--acc); }
.swatch { border: 2px solid var(--line2); }
.swatch.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--acc); }
.nodecard, .nodetile, .mcard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--nc); color: var(--ink); }
.nodecard.on, .nodetile.on { border-color: var(--nc); box-shadow: 0 0 0 1px var(--nc), 0 0 20px color-mix(in srgb, var(--nc) 30%, transparent); background: color-mix(in srgb, var(--nc) 8%, var(--panel)); }

/* laboratorio: ruta */

.dot { border-color: var(--panel); }
.dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.livebanner { background: linear-gradient(90deg, rgba(228, 172, 88, .18), transparent), var(--panel); color: var(--ink); border: 1px solid var(--amber); box-shadow: 0 0 22px rgba(228, 172, 88, .2); }
.ruta li { display: flex; }
.ruta { list-style: none; padding: 0; margin: 1.3em 0 .4em; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: .4em; counter-reset: r; }
.rstep { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: .35em; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--line2); border-radius: 4px; padding: .55em .6em; color: var(--muted); text-align: left; font-size: .86rem; line-height: 1.2; min-height: 64px; }

.rstep span { font-family: var(--f-display); font-weight: 600; }
.rstep:hover { border-color: var(--acc); color: var(--ink); }
.rstep.ok { border-top-color: var(--good); color: var(--ink); }

@media (max-width: 520px) { .ruta { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rstep { min-height: 0; flex-direction: row; align-items: center; } }
.pasocard .pc-h { display: flex; flex-wrap: wrap; align-items: center; gap: .3em 1em; }

.pc-grid { display: grid; grid-template-columns: 1.1fr 1fr .9fr; gap: 1em 1.6em; margin-top: .6em; }
.pc-grid h4 { margin: 0 0 .25em; font-family: var(--f-mono); font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; }

details.more { padding: .8em 1.2em; }

@media (max-width: 460px) { .bigopts.two-col { grid-template-columns: 1fr; } }
.mcol { background: var(--sunk); border: 1px solid var(--line); }

/* causas */
.builder .sentence, .sentence { display: flex; flex-wrap: wrap; align-items: center; gap: .5em .6em; font-family: var(--f-display); font-size: 1.15rem; margin: .4em 0 .8em; }

.sentence > span { color: var(--acc); font-weight: 700; }
.frases { list-style: none; padding: 0; margin: .4em 0 0; display: grid; gap: .5em; }
.frases li { background: var(--sunk); border: 1px solid var(--line); border-left: 3px solid var(--dc); border-radius: 4px; padding: .55em .75em; }

/* dictamen */

.chipbtn:hover { border-color: var(--acc); }
.osec { border-top: 1px dashed var(--line2); padding: .8em 0; }
.osec h4 { color: var(--ink); }

/* herramienta */

.hdot { width: 2.4em; height: 2.4em; border-radius: 50%; border: 1px solid var(--line2); background: var(--sunk); color: var(--muted); font-family: var(--f-mono); font-weight: 700; }
.hdot.ok { background: var(--good); border-color: var(--good); color: #032012; }

.herr-body { min-height: 200px; }

.row.between { justify-content: space-between; }
.check.big { font-size: 1.02rem; padding: .5em .6em; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; }
.check.big input { width: 1.2em; height: 1.2em; accent-color: var(--acc); }

/* presentación / kit */
.turnplan { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .4em; margin-top: .6em; }
.tp { display: flex; flex-direction: column; gap: .15em; background: var(--sunk); border: 1px solid var(--line); border-top: 3px solid var(--line2); border-radius: 4px; padding: .55em .65em; min-width: 0; }

.kitpick { margin-bottom: 1em; }

.kitopt p { flex: 1 1 100%; margin: 0; font-size: .9rem; }

.kitopt.on::after { content: "EN PANTALLA"; margin-left: auto; order: -1; font-family: var(--f-mono); font-size: .62rem; letter-spacing: .12em; color: var(--amber); border: 1px solid var(--amber); padding: .1em .4em; border-radius: 3px; }
.kitopt:hover:not(:disabled) { border-color: var(--amber); }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: .3em; }
.checklist li { display: flex; align-items: center; gap: .55em; color: var(--muted); }
.checklist li i { font-style: normal; display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border: 1px solid var(--line2); border-radius: 3px; font-family: var(--f-mono); }
.checklist li.ok { color: var(--ink); }

.ensayo { background: var(--panel); border: 1px dashed var(--line2); margin: 1.1em 0; }
.ensayo.on { border: 1px solid var(--amber); background: var(--signal-soft); }
.ensb { font-family: var(--f-display); color: var(--amber); font-size: 1.1rem; }
.bigtimer { color: var(--amber); text-shadow: 0 0 18px rgba(228, 172, 88, .35); }
.bigtimer.low, .low { color: var(--amber); text-shadow: 0 0 18px rgba(215, 193, 122, .4); }
.prog { margin-top: 1.1em; }

/* audiencia */
.agenda { list-style: none; padding: 0; margin: 1em 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4em; }

@media (max-width: 900px) { .agdetail { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .agdetail { grid-template-columns: 1fr; } }
.kn { display: inline-grid; place-items: center; width: 1.8em; height: 1.8em; flex: none; border: 1px solid var(--acc); color: var(--acc); border-radius: 3px; font-family: var(--f-mono); font-weight: 700; font-size: .85rem; }

.clock span { font-family: var(--f-mono); }
.clock b { color: var(--amber); }
.veredicto { background: linear-gradient(180deg, rgba(215, 193, 122, .14), transparent 80%), var(--panel); color: var(--ink); border-color: var(--amber); }
.veredicto::before { --cyan: var(--amber); }
.vtop { border-color: rgba(215, 193, 122, .5); }
.vtop span { color: var(--amber); font-family: var(--f-mono); }
.vtop b { color: var(--amber); text-shadow: 0 0 14px rgba(215, 193, 122, .6); }
.stamp { background: var(--panel); border-color: var(--good); color: var(--good); font-family: var(--f-display); letter-spacing: .1em; }
